# Round-robin load balancer with passive health checks: after 2 failures an instance is skipped for 5s.
upstream app {
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
    server app3:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 8080;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        # A dead instance must not fail the request: retry once on the next one.
        # Writes (POST/PUT) are not retried by default, which avoids duplicate posts.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
