# Same load balancer as lb.conf, plus a shared edge cache for anonymous reads (stand-in for a CDN).
proxy_cache_path /var/cache/nginx/edge keys_zone=edge:10m max_size=64m inactive=60s;

upstream app {
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
    server app3:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

server {
    listen 8080;

    location ~ ^/api/posts(/[0-9]+)?$ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;

        # Lifetime comes from the app's Cache-Control: public, max-age=N (only sent to anonymous readers).
        proxy_cache edge;
        proxy_cache_methods GET HEAD;
        # Requests that carry a session or a recent-write marker never read from or fill the shared cache.
        proxy_cache_bypass $cookie_sid $cookie_last_write;
        proxy_no_cache $cookie_sid $cookie_last_write;
        # One request refills an expired entry while others get the old copy: protects the origin from a stampede.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Edge-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
