# One file describes every component. A stage is just a set of profiles + env vars (stages/N.env):
# lab.sh sources that file, so `docker compose` sees which services to start and how to configure them.
name: scaling-lab

x-app: &app
  build:
    context: .
    target: app
  image: scaling-lab-app
  # Small CPU quota on purpose: the bottleneck must show up on any machine, not only slow ones.
  cpus: ${APP_CPUS:-0.5}
  mem_limit: 256m
  depends_on:
    db:
      condition: service_healthy
  environment: &app-env
    PORT: 3000
    PRIMARY_URL: postgres://lab:labpass@db:5432/lab
    REPLICA_URL: ${REPLICA_URL:-}
    REDIS_URL: redis://redis:6379
    SESSION_STORE: ${SESSION_STORE:-memory}
    CACHE: ${CACHE:-off}
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    READ_AFTER_WRITE_SECONDS: ${READ_AFTER_WRITE_SECONDS:-0}
    EDGE_MAX_AGE_SECONDS: ${EDGE_MAX_AGE_SECONDS:-0}
    REPLICA_FILL_TTL_SECONDS: ${REPLICA_FILL_TTL_SECONDS:-2}
    ALLOW_CACHE_BYPASS: ${ALLOW_CACHE_BYPASS:-off}
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  db:
    image: postgres:13-alpine
    cpus: ${DB_CPUS:-2.0}
    mem_limit: 512m
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass # lab-only value, never reuse
      POSTGRES_DB: lab
      REPLICATION_PASSWORD: replpass # lab-only value
    command: >
      postgres -c wal_level=replica -c max_wal_senders=5 -c max_replication_slots=5
      -c max_connections=200 -c hot_standby=on
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check on purpose: during first-time init Postgres runs a temporary server that only listens on the
      # unix socket, and a socket check would report healthy before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Stage 4+: asynchronous streaming replica cloned from db with pg_basebackup.
  replica:
    profiles: [replica]
    image: postgres:13-alpine
    cpus: ${DB_CPUS:-2.0}
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: labpass
      POSTGRES_DB: lab
      REPLICATION_PASSWORD: replpass
    entrypoint: ["/replica-entrypoint.sh"]
    volumes:
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 90

  # Stage 2+: shared session store. Stage 3+: also the cache (allkeys-lru, no persistence).
  redis:
    profiles: [redis]
    image: redis:6.2-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    # Stage 0 serves on the entry port; later stages keep app1 reachable on 8081 for debugging.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8081}:3000"

  app2:
    <<: *app
    profiles: [lb]
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  app3:
    <<: *app
    profiles: [lb]
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  # Stage 1+: nginx load balancer. Stage 5 swaps the config for one that also caches at the edge.
  lb:
    profiles: [lb]
    image: nginx:1.27-alpine
    cpus: 1.0
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    volumes:
      - ./nginx/${LB_CONF:-lb.conf}:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Load generator runs inside the compose network so host noise and port mappings do not skew numbers.
  loadgen:
    profiles: [tools]
    build:
      context: .
      target: loadtest
    image: scaling-lab-loadtest
